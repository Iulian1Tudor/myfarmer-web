<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Manage Subscription — MyFarmer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f0; color: #1a1a1a; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
    .card { background: white; border-radius: 16px; padding: 36px 28px; max-width: 440px; width: 100%; border: 1px solid #e0e0d8; text-align: center; }
    .icon { font-size: 48px; margin-bottom: 16px; }
    h1 { font-size: 22px; font-weight: 700; margin-bottom: 8px; }
    .subtitle { font-size: 15px; color: #666; margin-bottom: 28px; line-height: 1.5; }
    .btn { display: block; width: 100%; background: #2d6a2d; color: white; padding: 16px; border-radius: 10px; font-size: 16px; font-weight: 600; border: none; cursor: pointer; text-decoration: none; margin-bottom: 12px; }
    .btn:disabled { opacity: 0.5; cursor: not-allowed; }
    .btn-back { background: transparent; color: #666; font-size: 14px; padding: 8px; }
    .status { font-size: 14px; color: #666; margin-top: 16px; min-height: 20px; }
    .error { color: #c0392b; }
    .info { background: #f0f4ff; border: 1px solid #c0cfe8; border-radius: 8px; padding: 12px 16px; margin-bottom: 24px; font-size: 13px; color: #445; line-height: 1.5; text-align: left; }
  </style>
</head>
<body>

  <div class="card">
    <div class="icon">💳</div>
    <h1>Manage Subscription</h1>
    <p class="subtitle">Update your payment method, view invoices, or cancel your subscription.</p>

    <div class="info">
      ℹ️ You'll be taken to the Stripe Billing Portal — a secure page managed by Stripe. MyFarmer never stores your card details.
    </div>

    <button class="btn" id="manageBtn" onclick="openPortal()">Open Billing Portal</button>
    <a href="index.html" class="btn btn-back">← Back to MyFarmer</a>

    <p class="status" id="status"></p>
  </div>

  <script>
    const SUPABASE_URL = "https://ycoesxmrbwtcsoyixqjp.supabase.co";

    function getTokenFromHash() {
      const hash = window.location.hash.substring(1);
      const params = new URLSearchParams(hash);
      return params.get("access_token");
    }

    async function openPortal() {
      const btn = document.getElementById("manageBtn");
      const status = document.getElementById("status");

      const token = getTokenFromHash();
      if (!token) {
        status.className = "status error";
        status.textContent = "No session found. Please open this page from the MyFarmer app.";
        return;
      }

      btn.disabled = true;
      status.className = "status";
      status.textContent = "Loading billing portal…";

      try {
        const res = await fetch(`${SUPABASE_URL}/functions/v1/create-portal-session`, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Authorization": `Bearer ${token}`,
          },
        });

        const data = await res.json();

        if (data.error) {
          throw new Error(data.error);
        }

        window.location.href = data.url;

      } catch (err) {
        btn.disabled = false;
        status.className = "status error";
        status.textContent = err.message || "Something went wrong. Please try again.";
      }
    }
  </script>

</body>
</html>
