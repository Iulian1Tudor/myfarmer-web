<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Subscribed! — MyFarmer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #f5f5f0; color: #1a1a1a; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { background: white; border-radius: 16px; padding: 40px 28px; max-width: 400px; width: 100%; border: 1px solid #e0e0d8; text-align: center; }
    .icon { font-size: 56px; margin-bottom: 16px; }
    h1 { font-size: 24px; font-weight: 700; margin-bottom: 12px; color: #2d6a2d; }
    p { font-size: 15px; color: #555; line-height: 1.6; margin-bottom: 28px; }
    .btn { display: block; background: #2d6a2d; color: white; padding: 16px; border-radius: 10px; font-size: 16px; font-weight: 600; text-decoration: none; }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon">🎉</div>
    <h1>You're subscribed!</h1>
    <p>Welcome to MyFarmer. Your farm is now visible to buyers. Return to the app to manage your listings.</p>
    <a href="myfarmer://" class="btn">Return to App</a>
  </div>
</body>
</html>
